# CHB-MIT Synthetic Seizure Augmentation Benchmark - primary config
# Mirrors chbmit_synthetic_augmentation_reframe_v5_3.md (harm-first reframe of v5.0/v5.2).
# Core grid is the "minimum publishable" trimmed grid (v5.3 Sec 5.4): cVAE-only,
# real_only/class_weighted/classical_aug/ungated/gated, single validation-selected q.

project:
  name: chbmit_gen_x_detector
  base_seed: 42

paths:
  raw_chbmit: data/raw_chbmit
  processed_chbmit: data/processed_chbmit
  raw_siena: data/raw_siena
  processed_siena: data/processed_siena
  results: results_chbmit_synthetic

manifest:
  include_chb24: true
  group_chb01_chb21: true

preprocessing:
  target_sampling_rate: 256
  bandpass_low_hz: 0.5
  bandpass_high_hz: 40.0
  notch_hz: null
  dtype: float32
  storage_format: zarr

channels:
  montage: bipolar
  missing_channel_policy: drop_file
  max_dropped_seizure_fraction: 0.10

windowing:
  window_seconds: 4
  stride_seconds: 2
  label_rule: center_in_seizure
  exclude_boundary_seconds: 0
  save_metadata_only: true

normalization:
  method: per_window_channel_zscore
  scope: window
  epsilon: 1.0e-6

splitting:
  strategy: balanced_group_kfold
  n_folds: 5
  validation_fraction_within_train: 0.20
  require_seizure_in_val: true
  require_seizure_in_test: true
  balance_targets: [seizure_event_count, seizure_duration_seconds, total_duration_seconds]

negative_sampling:
  background_to_seizure_ratio: 5
  exclude_seconds_around_seizure: 60

scarcity:
  fractions: [1.0, 0.5, 0.25]
  optional_fractions: [0.10]
  selection_level: seizure_event
  same_subset_for_classifier_and_generator: true
  minimum_generator_seizure_windows: 256

seeds:
  dev: [42]
  core: [42, 123, 2024]

detectors:
  required: [eegnet, lct, tcn]
  optional: [cnn_mamba, seizure_transformer]

generators:
  in_house: [wgan_gp, cvae]
  core: [cvae]                 # v5.3 Sec 5.4: cVAE only in the core grid
  appendix: [wgan_gp]          # WGAN-GP is a sensitivity axis (appendix)
  optional_external: [gp_eeg]
  optional_stretch: [diffusion]
  core_synthetic_ratios: [1.0]
  optional_synthetic_ratios: [0.5, 2.0]

augmentation:
  # v5.3 core conditions (balanced_sampler dropped from core; still selectable a la carte).
  core_methods: [real_only, class_weighted, classical_aug, ungated_synthetic_aug,
                 trust_gated_synthetic_aug]
  target_class: seizure
  classical:
    jitter_std: 0.02
    amplitude_scale: [0.9, 1.1]
    max_time_shift_samples: 64
    channel_dropout_p: 0.10
    max_dropped_channels: 2

classifier_training:
  batch_size: 64
  epochs: 80
  early_stopping_patience: 12
  learning_rate: 0.0003
  optimizer: adamw
  weight_decay: 0.0001
  threshold_selection: validation_best_event_f1

postprocessing:
  method: k_of_n
  k: 3
  n: 5
  threshold: validation_selected
  min_alarm_gap_seconds: 60

evaluation:
  use_szcore: true
  event_metrics: [event_sensitivity, event_precision, event_f1, fp_per_24h, fa_per_hour, median_latency_seconds]
  sensitivity_at_fa_budgets: [0.5, 1.0, 2.0]
  window_metrics: [balanced_accuracy, auroc, auprc, sensitivity, specificity, precision, recall, macro_f1, kappa]
  patient_level: true

stats:
  paired_test: wilcoxon
  bootstrap_ci: 0.95
  report_per_cell: true

quality_checks:
  waveform_examples: 12
  psd_examples: 200
  embedding_method: umap
  nearest_neighbors: 12
  compute_mmd: true
  compute_cross_channel_correlation: true
  real_vs_synthetic_discriminator: true

# Fail-closed trust gate ADAPTED from TGA (Choi et al., npj Digit. Med. 9(1) 634, 2026;
# doi:10.1038/s41746-026-02778-0) to seizure-specific event-level
# criteria (v5.3 Sec 3.1, 5). Teacher = the real_only detector (reused, not retrained).
# Values are PRE-REGISTERED in PREREGISTRATION.md; do not tune on the test set.
trust_gate:
  teacher: real_only_model        # detector teacher = the real_only model on disk (Sec 5.1)
  q_core: 0.90                    # single validation-selected admission quantile (core)
  q_grid: [0.75, 0.90, 0.99]      # full admission sweep (appendix only, Sec 5.3)
  oversample: 6                   # candidate pool = oversample x target synthetic count
  admit_margin_event_f1: 0.0      # gated val event-F1 must beat real_only by >= this
  fp24h_safety_slack: 0.25        # gated val FP/24h must not exceed real_only by > this
  min_admitted: 1                 # below this, fail closed (treat as no synthetic admitted)

# Pre-registered harm definition and tail-risk reporting (v5.3 Sec 0, 6). A paired delta
# (vs the named references) counts as HARM if event-F1 drops past the threshold OR FP/24h
# inflates past its threshold. Reported alongside harm_rate, worst-fold delta, and CVaR.
harm:
  references: [real_only, class_weighted, classical_aug]
  delta_event_f1_threshold: -0.01   # d(event_f1) below this counts as harm
  delta_fp24h_threshold: 0.25       # d(FP/24h) above this counts as harm
  cvar_alpha: 0.10                  # tail fraction for CVaR (worst 10%)
