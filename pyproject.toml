[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chbmit-synthetic-benchmark"
version = "0.1.0"
description = "Leakage-safe generator x detector benchmark for synthetic ictal EEG augmentation (CHB-MIT, Siena)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["chbmit", "models", "augmentation", "synthetic", "evaluation", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
